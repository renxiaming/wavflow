datasets:
  name: SFT_JSONL
  dataset_type: JsonlPromptGen
  jsonl_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  lance_path: null
  text_index_path: null
  text_jsonl_path: null
  load_speech_tokens: true
  speech_token_rate: 25.0
  polyphone: true
  batch_size_per_gpu: 4000
  batch_size_type: frame
  max_samples: 64
  num_workers: 1
optim:
  epochs: 50
  learning_rate: 5.0e-06
  num_warmup_updates: 1000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: false
model:
  name: WavTTS_Large_spkconcat
  tokenizer: custom
  tokenizer_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/Emilia_Lance_pinyin/vocab.txt
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: uniform
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: false
    aux_mel_loss_weight: 0.0
    use_repa_loss: false
    repa_loss_weight: 0.0
    repa_layer: -1
    repa_teacher_model: null
    repa_teacher_layer: 6
    repa_teacher_dim: 768
    repa_alignment_hidden: 512
    use_stft_loss: false
    stft_loss_weight: 0.0
    stft_gamma: 1.0
    stft_eps: 0.01
    stft_start_update: 0
    sample_rate: 16000
    cond_mode: external_prompt
    prefix_drop_prob: 0.5
    prefix_frac: 0.3
    training_cfg_rate: 0.2
    joint_cond_drop_prob: 0.0
    audio_drop_prob: 0.0
    cond_drop_prob: 0.0
  speaker_embedding:
    online_extract: true
    model_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/pretrain_models/CosyVoice2-0.5B/campplus.onnx
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: true
    condition_type: speech_token
    speech_token_num_embeds: 6561
    speech_token_dim: null
    speech_token_mask_padding: true
    speech_token_conv_layers: null
    speech_token_upsampling: linear
    speech_token_offset: 0
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: true
    use_audio_proj: true
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    use_spk_embedding: true
    spk_embed_dim: 192
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160
ckpts:
  logger: wandb
  wandb_entity: xiamingren91-nwpu
  wandb_project: WavTTS-SFT
  log_samples: true
  save_per_updates: 1000
  keep_last_n_checkpoints: -1
  last_per_updates: 500
  exp_name: WavTTS_xpred_spkconcat_grpo
  save_dir: ./exp/nar_wav_tts_grpo

grpo:
  init_ckpt: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/ckpts/model_80000.pt
  jsonl: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  output_dir: ./exp/nar_wav_tts_grpo
  batch_size_frames: 30000
  reward_backend: resident
  reward_root: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/third_party/sim_wer_test
  reward_server_host: 127.0.0.1
  reward_server_port: 29631
  group_size: 24
  ppo_epochs: 1
  # Full-parameter GRPO fine-tuning is the default; LoRA can be enabled below.
  learning_rate: 5.0e-6
  max_grad_norm: 1.0
  clip_eps: 0.05
  adv_clip_max: 5.0
  kl_coef: 0.04
  # GRPO needs a non-zero Gaussian policy variance. Use CFM.sample() for
  # deterministic ODE quality checks instead of setting this to zero.
  # 0.1 produced overly unstable rollouts in this WavTTS setup. 0.05 keeps
  # meaningful within-group variation while reducing electric/noisy samples.
  noise_scale: 0.1
  # Match the normal inference solver more closely than the previous 25-step
  # rollout while keeping GRPO cost below the 50-step inference setting.
  steps: 10
  # Original official Flow-GRPO SD3 config uses CFG.
  use_cfg: true
  cfg_strength: 1.5
  timestep_mapping: power
  timestep_power: 2.0
  shift: 3.0
  token_rate: 25.0
  wer_weight: 0.2
  sim_weight: 0.8
  target_rms: 0.1
  reward_language: zh
  # Keep trainable model parameters in FP32. compute_dtype only controls
  # autocast around rollout/replay forward passes.
  model_dtype: fp32
  compute_dtype: bf16
  use_lora: false
  lora_rank: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  lora_targets: attn.to_q,attn.to_k,attn.to_v,attn.to_out.0
  save_per_updates: 100
  max_updates: 5000
  no_reference: false
  keep_rollouts: true
