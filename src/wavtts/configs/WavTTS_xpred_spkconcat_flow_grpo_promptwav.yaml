datasets:
  name: GRPO_PROMPT_WAV_SELF_PREFIX_JSONL
  dataset_type: JsonlSelfPrefix
  jsonl_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  load_speech_tokens: true
  speech_token_rate: 25.0
  batch_size_per_gpu: 80000
  batch_size_type: frame
  max_samples: 64
  num_workers: 1

optim:
  learning_rate: 5.0e-6
  max_grad_norm: 1.0

model:
  name: WavTTS_Large_spkconcat
  tokenizer: custom
  tokenizer_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/Emilia_Lance_pinyin/vocab.txt
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: uniform
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: true
    aux_mel_loss_weight: 0.05
    use_repa_loss: true
    repa_loss_weight: 0.005
    repa_layer: 17
    repa_teacher_model: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/pretrain_models/grpo_rewards/wavlm-base-plus
    repa_teacher_dim: 768
    repa_alignment_hidden: 512
    use_stft_loss: true
    stft_loss_weight: 0.0008
    stft_gamma: 1.0
    stft_eps: 0.01
    stft_start_update: 0
    sample_rate: 16000
    cond_mode: prefix
    prefix_drop_prob: 0.0
    prefix_frac: 0.3
    prefix_loss_on_suffix_only: true
    training_cfg_rate: 0.2
    joint_cond_drop_prob: 0.0
    audio_drop_prob: 0.0
    cond_drop_prob: 0.0
  speaker_embedding:
    online_extract: true
    model_path: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/pretrain_models/CosyVoice2-0.5B/campplus.onnx
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: true
    condition_type: speech_token
    speech_token_num_embeds: 6561
    speech_token_dim: null
    speech_token_mask_padding: true
    speech_token_conv_layers: null
    speech_token_upsampling: linear
    speech_token_offset: 0
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: true
    use_audio_proj: true
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    use_spk_embedding: true
    spk_embed_dim: 192
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160

ckpts:
  logger: wandb
  wandb_entity: xiamingren91-nwpu
  wandb_project: WavTTS-GRPO
  log_samples: true
  save_per_updates: 100
  keep_last_n_checkpoints: -1
  exp_name: WavTTS_xpred_spkconcat_flow_grpo_promptwav
  save_dir: ./exp/nar_wav_tts_flow_grpo_promptwav

grpo:
  init_ckpt: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/ckpts/model_80000.pt
  jsonl: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  output_dir: ./result/grpo_promptwav_selfprefix
  data_mode: self_prefix
  prompt_fraction_min: 0.0
  prompt_fraction_max: 0.3
  prefix_seed: 666
  batch_size_frames: 80000
  reward_backend: resident
  reward_root: /home/A02_tmpdata0/xmren/code/grpo_flow/wavtts3.1_grpo/portable_wavtts_grpo/third_party/sim_wer_test
  reward_server_host: 127.0.0.1
  reward_server_port: 29631
  group_size: 24
  prompts_per_update: 18
  ppo_epochs: 2
  train_timestep_fraction: 1.0
  learning_rate: 5.0e-5
  lr_scheduler: linear
  max_grad_norm: 1.0
  clip_eps: 0.0001
  adv_clip_max: 5.0
  kl_coef: 0.01
  noise_scale: 0.3
  steps: 16
  rollout_steps_min: 8
  sde_window_size: 2
  sde_window_start_min: 1
  sde_window_start_max: 3
  use_cfg: false
  cfg_strength: 1.0
  timestep_mapping: uniform
  timestep_power: 2.0
  shift: 1.0
  token_rate: 25.0
  wer_weight: 0.2
  sim_weight: 0.4
  mos_weight: 0.4
  reward_std_eps: 1.0e-4
  sft_anchor_coef: 0.01
  target_rms: 0.1
  reward_language: zh
  model_dtype: fp32
  compute_dtype: bf16
  use_lora: false
  lora_rank: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  lora_targets: attn.to_q,attn.to_k,attn.to_v,attn.to_out.0
  save_per_updates: 200
  max_updates: 10000
  no_reference: false
  keep_rollouts: true
