datasets:
  name: SFT_JSONL
  dataset_type: JsonlPromptGen
  jsonl_path: /home/A02_tmpdata1/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  lance_path: null
  text_index_path: null
  text_jsonl_path: null
  load_speech_tokens: true
  speech_token_rate: 25.0
  polyphone: true
  batch_size_per_gpu: 4000
  batch_size_type: frame
  max_samples: 64
  num_workers: 1
optim:
  epochs: 50
  learning_rate: 1.0e-05
  num_warmup_updates: 1000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: false
model:
  name: WavTTS_Large_spkconcat
  tokenizer: custom
  tokenizer_path: data/Emilia_Lance_pinyin/vocab.txt
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: uniform
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: false
    aux_mel_loss_weight: 0.0
    use_repa_loss: false
    repa_loss_weight: 0.0
    repa_layer: -1
    repa_teacher_model: null
    repa_teacher_layer: 6
    repa_teacher_dim: 768
    repa_alignment_hidden: 512
    use_stft_loss: false
    stft_loss_weight: 0.0
    stft_gamma: 1.0
    stft_eps: 0.01
    stft_start_update: 0
    sample_rate: 16000
    cond_mode: external_prompt
    prefix_drop_prob: 0.5
    prefix_frac: 0.3
    training_cfg_rate: 0.2
    joint_cond_drop_prob: 0.0
    audio_drop_prob: 0.0
    cond_drop_prob: 0.0
  speaker_embedding:
    online_extract: true
    model_path: pretrain_models/CosyVoice2-0.5B/campplus.onnx
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: true
    condition_type: speech_token
    speech_token_num_embeds: 6561
    speech_token_dim: null
    speech_token_mask_padding: true
    speech_token_conv_layers: null
    speech_token_upsampling: linear
    speech_token_offset: 0
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: true
    use_audio_proj: true
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    use_spk_embedding: true
    spk_embed_dim: 192
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160
ckpts:
  logger: wandb
  wandb_entity: xiamingren91-nwpu
  wandb_project: WavTTS-SFT
  log_samples: true
  save_per_updates: 1000
  keep_last_n_checkpoints: -1
  last_per_updates: 500
  exp_name: WavTTS_xpred_spkconcat_grpo
  save_dir: ./exp/nar_wav_tts_grpo

grpo:
  init_ckpt: ckpts/model_80000.pt
  jsonl: /home/A02_tmpdata1/xmren/code/grpo_flow/wavtts3.1_grpo/data/grpo_seed/zh/seedtest_zh_cosyvoice2_tokens.jsonl
  output_dir: ./exp/nar_wav_tts_grpo
  reward_backend: resident
  reward_root: third_party/sim_wer_test
  reward_server_host: 127.0.0.1
  reward_server_port: 29631
  group_size: 8
  ppo_epochs: 1
  learning_rate: 5.0e-6
  max_grad_norm: 1.0
  clip_eps: 0.2
  kl_coef: 0.04
  noise_scale: 0.05
  steps: 10
  cfg_strength: 1.5
  timestep_mapping: uniform
  shift: 3.0
  token_rate: 25.0
  wer_weight: 0.2
  sim_weight: 0.8
  reward_language: zh
  model_dtype: bf16
  lora_rank: 32
  lora_alpha: 64.0
  lora_dropout: 0.0
  lora_targets: attn.to_q,attn.to_k,attn.to_v,attn.to_out.0
  save_per_updates: 100
  max_updates: 5000
  no_reference: false
