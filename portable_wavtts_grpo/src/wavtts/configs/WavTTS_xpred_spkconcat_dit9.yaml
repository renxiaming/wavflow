hydra:
  run:
    dir: ckpts/${model.name}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: Emilia_Lance
  dataset_type: EmiliaLance
  lance_path: /home/work_nfs23/xmren/lance/emilia_wav_token
  text_index_path: /home/work_nfs23/xmren/lance/emilia_text.db
  text_jsonl_path: /home/work_nfs23/hkxie/data/Emilia/emilia_merged.jsonl
  load_speech_tokens: false
  polyphone: true
  batch_size_per_gpu: 10000
  batch_size_type: frame
  max_samples: 64
  num_workers: 1

optim:
  epochs: 686
  learning_rate: 7.5e-5
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: WavTTS_Large_spkconcat
  tokenizer: custom
  tokenizer_path: null
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    use_repa_loss: True
    repa_loss_weight: 0.005
    # Python index 8 = the 9th DiT block.
    repa_layer: 8
    repa_teacher_model: microsoft/wavlm-base-plus
    # No layer is set: REPA uses WavLM's final last_hidden_state.
    repa_teacher_dim: 768
    repa_alignment_hidden: 512
    use_stft_loss: True
    stft_loss_weight: 0.0008
    stft_gamma: 1.0
    stft_eps: 0.01
    stft_start_update: 60000
    sample_rate: 16000
    cond_mode: prefix
    prefix_drop_prob: 0.5
    prefix_frac: 0.3
    training_cfg_rate: 0.2
    joint_cond_drop_prob: 0.0
    audio_drop_prob: 0.0
    cond_drop_prob: 0.0
  speaker_embedding:
    online_extract: True
    model_path: /home/work_nfs23/xmren/huawei_proj/huawei_streaming_cosyvoice/pretrain_models/CosyVoice2-0.5B/campplus.onnx
  arch:
    dim: 1152
    depth: 28
    heads: 16
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: True
    condition_type: speech_token
    speech_token_num_embeds: 6561
    speech_token_dim: null
    speech_token_mask_padding: True
    speech_token_conv_layers: null
    speech_token_upsampling: linear
    speech_token_offset: 0
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: False
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 768
    use_spk_embedding: True
    spk_embed_dim: 192
  waveform:
    target_sample_rate: 16000
    wav_frame_len: 160

ckpts:
  logger: wandb
  wandb_entity: xiamingren91-nwpu
  wandb_project: WavTTS_grpo
  log_samples: True
  save_per_updates: 20000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  exp_name: WavTTS_xpred_spkconcat_dit9-Emilia_Lance-tokentowav-xpred-vloss-spkconcat-repa-dit9-stft-vapa60k
  save_dir: ckpts/WavTTS_xpred_spkconcat_dit9-Emilia_Lance-tokentowav-xpred-vloss-spkconcat-repa-dit9-stft-vapa60k
